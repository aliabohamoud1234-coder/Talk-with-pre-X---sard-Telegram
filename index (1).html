  d.onclick=()=>menu(m);l.append(d)});
 if(b)l.scrollTop=l.scrollHeight;const p=[...M].reverse().find(m=>m.pin);$('#pn').style.display=p?'block':'none';if(p)$('#pn').textContent='📌 '+(p.x||'📎').slice(0,80)}
